# One command, both boxes: starts the Ferro gateway AND this LangGraph recipe,
# pre-wired. This recipe routes three nodes to three providers, so the gateway
# needs OpenAI + Anthropic + Gemini keys.
#
#   cp .env.example .env   # fill in MASTER_KEY + the three provider keys
#   docker compose up
#
# The gateway is its PUBLISHED image (`latest` unless GATEWAY_VERSION pins it)
# — no gateway source is vendored.
# Provider keys go into the gateway container only; the recipe never sees them.

services:
  gateway:
    # Defaults to the newest gateway. Pin a release for reproducibility with
    # GATEWAY_VERSION (e.g. GATEWAY_VERSION=1.4.1 in .env or inline).
    image: ghcr.io/ferro-labs/ai-gateway:${GATEWAY_VERSION:-latest}
    environment:
      # planner→OpenAI, coder→Anthropic, summarizer→Gemini. Default empty so the
      # file always parses (e.g. for the keyless `make test`); set them in .env
      # for `make run`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MASTER_KEY: ${MASTER_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  recipe:
    build: .
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      FERRO_BASE_URL: http://gateway:8080
      FERRO_API_KEY: ${MASTER_KEY}
      AGENT_REQUEST: ${AGENT_REQUEST:-}
